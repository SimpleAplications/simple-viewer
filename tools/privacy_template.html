<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{p.title}}</title>
<meta name="description" content="{{p.description}}">
<link rel="icon" href="{{up}}favicon.ico">
<style>
  :root { --bg: #0b0b0c; --line: #2a2a2e; --text: #f2f2f3; --soft: #a9a9b2; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f6f7; --line: #dcdce1; --text: #111113; --soft: #5d5d68; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.6 "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  a { color: inherit; text-underline-offset: 3px; }
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; padding-top: 14px; font-size: 14px; color: var(--soft); }
  h1 { font-size: 40px; line-height: 1.1; letter-spacing: -1px; margin: 44px 0 6px; font-weight: 650; }
  .updated { color: var(--soft); margin: 0 0 30px; font-size: 15px; }
  h2 { font-size: 21px; margin: 30px 0 8px; font-weight: 650; }
  p { margin: 0 0 12px; }
  code { font-size: 15px; }
  footer { padding: 30px 0 60px; color: var(--soft); font-size: 14px; border-top: 1px solid var(--line); margin-top: 40px; }
</style>
</head>
<body>

<nav class="wrap top">
  <a href="{{home}}">{{p.back}}</a>
  <span>{{switcher}}</span>
</nav>

<main class="wrap">
  <h1>{{p.h1}}</h1>
  <p class="updated">{{p.updated}}</p>

  <h2>{{p.short.h}}</h2>
  <p>{{p.short}}</p>

  <h2>{{p.local.h}}</h2>
  <p>{{p.local}}</p>

  <h2>{{p.network.h}}</h2>
  <p>{{p.network.1}}</p>
  <p>{{p.network.2}}</p>

  <h2>{{p.store.h}}</h2>
  <p>{{p.store}}</p>

  <h2>{{p.contact.h}}</h2>
  <p>{{p.contact}}</p>
  <p>{{p.changes}}</p>
</main>

<footer class="wrap">
  <p>{{p.footer}}</p>
</footer>

</body>
</html>
